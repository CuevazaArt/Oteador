[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oteador"
version = "0.0.1"
description = "Supervisor de histogramas para trading adaptativo en Binance Spot"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Cuevaza" }]
keywords = ["binance", "trading", "cryptocurrency", "mean-reversion", "histogram", "optuna"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "typer>=0.12",
    "structlog>=24.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "polars>=1.0",
    "numpy>=1.26",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "scipy-stubs>=1.13",
]

[project.urls]
Homepage = "https://github.com/CuevazaArt/Oteador"
Issues = "https://github.com/CuevazaArt/Oteador/issues"
Repository = "https://github.com/CuevazaArt/Oteador.git"

[project.scripts]
oteador = "oteador.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/oteador"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
